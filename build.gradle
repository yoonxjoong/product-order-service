plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.epages.restdocs-api-spec' version '0.20.2'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'product-order-service'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-h2console'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2'
    implementation("com.google.guava:guava:33.7.2-jre")

    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'com.h2database:h2'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'

    testImplementation 'io.rest-assured:rest-assured:4.5.1'
    testImplementation 'io.rest-assured:json-path:4.5.1'
    testImplementation 'io.rest-assured:xml-path:4.5.1'

    testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'
    testImplementation 'com.epages:restdocs-api-spec-mockmvc:0.20.2'
}

tasks.named('test') {
    useJUnitPlatform()
}

openapi3 {
    server = 'http://localhost:8080'
    title = 'Product Order Service API'
    description = '''\
헥사고날 아키텍처로 설계한 상품 · 주문 · 결제 API 명세입니다.

이 문서는 문서화 테스트(Spring REST Docs)를 통과한 **실제 요청과 응답**으로 생성됩니다. \
문서와 실제 응답이 다르면 테스트가 실패하므로, 문서와 동작은 항상 일치합니다.

## 에러 응답
| 상태 코드 | 상황 |
|---|---|
| `400 Bad Request` | 잘못된 입력값 (예: `page=-1`) |
| `404 Not Found` | 존재하지 않는 리소스 |

에러 응답 본문에는 원인 메시지가 `text/plain`으로 담깁니다.

[GitHub 저장소](https://github.com/yoonxjoong/product-order-service)'''
    version = '0.0.1'
    format = 'yaml'
}

// restdocs-api-spec 이 비워 두는 태그 목록(문서 목차 순서)과 응답 설명을 보완한다
def apiTags = '''\
tags:
- name: Product
  description: 상품 등록 · 조회 · 수정
- name: Order
  description: 상품 주문'''
def responseDescriptions = ['200': 'OK', '201': 'Created', '400': 'Bad Request', '404': 'Not Found']

// 문서화 테스트로 생성한 openapi3.yaml + API 레퍼런스 페이지(Scalar)를 정적 사이트로 묶는다 (build/api-docs)
tasks.register('apiDocs', Copy) {
    dependsOn tasks.named('openapi3')
    inputs.property('apiTags', apiTags)
    inputs.property('responseDescriptions', responseDescriptions)
    from 'src/docs/api'
    from(layout.buildDirectory.dir('api-spec')) {
        filter { String line ->
            if (line == 'tags: []') {
                return apiTags
            }
            // 응답 설명은 상태 코드만 들어가므로(description: "201") 의미 있는 문구로 바꾼다
            def matcher = line =~ /^(\s+description: )"(\d{3})"$/
            matcher.matches() && responseDescriptions[matcher.group(2)]
                    ? matcher.group(1) + responseDescriptions[matcher.group(2)]
                    : line
        }
    }
    into layout.buildDirectory.dir('api-docs')
}
